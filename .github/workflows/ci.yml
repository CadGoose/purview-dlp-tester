name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Rule pack must pass its own sample corpus
        run: |
          dlp-tester check sits/canada.yaml
          dlp-tester test sits/canada.yaml samples/docs
          dlp-tester export sits/canada.yaml -o rulepack.xml
